name: Setup Xcode
description: Selects the Xcode version to build with and verifies it. Falls back to a checked-in default when the caller doesn't supply one (e.g. the XCODE_VERSION repository variable isn't accessible for forked-repo pull requests).

inputs:
  version:
    description: Xcode version to select, e.g. 26.6. Typically passed as the XCODE_VERSION repository variable; when empty, the action's built-in fallback is used.
    required: false
    default: ''

outputs:
  version:
    description: The Xcode version that was actually selected (either the input or the fallback).
    value: ${{ steps.resolve.outputs.version }}

runs:
  using: composite
  steps:
    - id: resolve
      name: Resolve Xcode Version
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"
        if [ -z "$VERSION" ]; then
          # Single source of truth for the fallback Xcode version, used when
          # vars.XCODE_VERSION isn't available
          VERSION="26.6"
          echo "No version provided. Using fallback: $VERSION"
        else
          echo "Using provided version: $VERSION"
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Set Xcode Version
      shell: bash
      run: |
        TARGET_XCODE_PATH="/Applications/Xcode_${{ steps.resolve.outputs.version }}.app"
        
        # Fail gracefully and clearly if the requested version isn't on the runner
        if [ ! -d "$TARGET_XCODE_PATH" ]; then
          echo "::error::Xcode version ${{ steps.resolve.outputs.version }} was not found at $TARGET_XCODE_PATH."
          echo "Available Xcode versions on this runner:"
          ls -1d /Applications/Xcode*.app || true
          exit 1
        fi

        sudo xcode-select -s "$TARGET_XCODE_PATH"
        
        # Export for .NET
        echo "MD_APPLE_SDK_ROOT=$TARGET_XCODE_PATH" >> "$GITHUB_ENV"
        echo "Successfully set Xcode to $TARGET_XCODE_PATH" >> "$GITHUB_STEP_SUMMARY"

    - name: Verify Xcode Version
      shell: bash
      run: xcodebuild -version

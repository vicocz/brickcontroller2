name: Setup Xcode
description: Selects the Xcode version to build with and verifies it. Falls back to a checked-in default when the caller doesn't supply one (e.g. the XCODE_VERSION repository variable isn't accessible for forked-repo pull requests).

inputs:
  version:
    description: 'Preferred Xcode version (optional). Falls back to the newest installed.'
    required: false

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        REQUESTED="${{ inputs.version }}"
        TARGET=""

        if [ -n "$REQUESTED" ] && [ -d "/Applications/Xcode_${REQUESTED}.app" ]; then
          TARGET="/Applications/Xcode_${REQUESTED}.app"
        else
          [ -n "$REQUESTED" ] && echo "::warning::Xcode $REQUESTED not found, falling back to newest installed."
          # Newest versioned install (version sort), ignoring the plain Xcode.app symlink
          TARGET=$(ls -d /Applications/Xcode_*.app | sed 's/\.app$//' | sort -V | tail -n1).app
        fi

        echo "Using $TARGET"
        sudo xcode-select -s "$TARGET/Contents/Developer"
        xcodebuild -version

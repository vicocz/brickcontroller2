name: Build BrickController Android

on:
  push:
    branches:
      - default
      - 'release/**'
    paths:
      - '.github/**/*android.yml'
      - '*.props'
      - '*.slnx'
      - 'BrickController2/BrickController2/**'
      - 'BrickController2/BrickController2.Android/**'
  pull_request:
    branches:    
      - default
      - 'release/**'
    paths:
      - '.github/**/*android.yml'
      - '*.props'
      - '*.slnx'
      - 'BrickController2/BrickController2/**'
      - 'BrickController2/BrickController2.Android/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_PATH: "BrickController2/BrickController2.Android/BrickController2.Android.csproj"
  TARGET_FRAMEWORK: '${{ vars.DOTNET_VERSION_TARGETS }}-android'

jobs:
  build-android:
    runs-on: ubuntu-latest
    name: BrickController Android Build

    steps:
    - uses: actions/checkout@v6
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ vars.DOTNET_VERSION }}

    - name: Install .NET MAUI Workload
      run: dotnet workload install maui-android

    - name: Restore Dependencies
      run: dotnet restore ${{env.PROJECT_PATH}}

    - name: Build MAUI Android (APK)
      run: >-
        dotnet publish ${{env.PROJECT_PATH}}
        -c Release
        -f ${{ env.TARGET_FRAMEWORK }}
        --no-restore
        -p:ApplicationVersion="${{ github.run_number }}"
        -p:AndroidPackageFormat=apk
        -p:AndroidKeyStore=false

    - name: Upload Android Artifact
      uses: actions/upload-artifact@v7
      with:
        name: brickcontroller-android-ci-build
        path: BrickController2/BrickController2.Android/bin/Release/${{ env.TARGET_FRAMEWORK }}/com.scn.BrickController2-Signed.apk


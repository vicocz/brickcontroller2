name: Build BrickController Android 

on:
  push:
    branches:
      - default
      - 'releases/**'
    paths:
      - '.github/**/*.yml'
      - 'BrickController2/*.props'
      - 'BrickController2/*.sln'
      - 'BrickController2/BrickController2/**'
      - 'BrickController2/BrickController2.Android/**'
  pull_request:
    branches:    
      - default
      - 'releases/**'
    paths:
      - '.github/**/*.yml'
      - 'BrickController2/*.props'
      - 'BrickController2/*.sln'
      - 'BrickController2/BrickController2/**'
      - 'BrickController2/BrickController2.Android/**'
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: windows-2025
    name: BrickController Android Build
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Get Release ID by tag
      id: get_release_id
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        # Required inputs
        $tag = "2025.03-alfa2"  # <-- Replace with your actual tag or make it an input/env var
        $repo = "${{ github.repository }}"
        $token = "${{ secrets.GITHUB_TOKEN }}"

        # GitHub API URL
        $url = "https://api.github.com/repos/$repo/releases/tags/$tag"
        # Fetch the release data
        $response = Invoke-RestMethod -Uri $url -Headers @{ Authorization = "Bearer $token"; "User-Agent" = "powershell-script" }
        # Extract release ID
        $releaseId = $response.id
        Write-Host "Release ID: $releaseId"
        # Set output
        echo "release_id=$releaseId" >> $env:GITHUB_OUTPUT

    - name: Use Release ID
      run: echo "Release ID is ${{ steps.get_release_id.outputs.release_id }}"


            
    - name: Restore Dependencies
      run: dotnet restore BrickController2/BrickController2.Android/BrickController2.Android.csproj
    - name: Build MAUI Android
      run: dotnet publish BrickController2/BrickController2.Android/BrickController2.Android.csproj -c Release -f net9.0-android --no-restore

    - name: Upload Android Artifact
      uses: actions/upload-artifact@v4
      with:
        name: brickcontroller-android-ci-build
        path: BrickController2/BrickController2.Android/bin/Release/net9.0-android/com.scn.BrickController2-Signed.apk

    - name: Upload Artifact to Release
      #if: github.event_name == 'release' && github.event.action == 'published'
      run: |
        # Authenticate GitHub CLI
        gh auth setup-git
        gh auth login --with-token <<< "$env:GITHUB_TOKEN"
        # Upload file to release
        gh release upload 2025.03-alfa2 BrickController2/BrickController2.Android/bin/Release/net9.0-android/com.scn.BrickController2-Signed.apk --repo ${{ github.repository }} --clobber
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Release BrickController iOS 

on:
  push:
    branches:
      - default
      - 'release/**'
    paths:
      - '.github/**/*ios.yml'
      - '*.props'
      - '*.slnx'
      - 'BrickController2/BrickController2/**'
      - 'BrickController2/BrickController2.iOS/**'
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

env:
  XCODE_VERSION: ${{ vars.XCODE_VERSION }}
  PROJECT_FOLDER: "BrickController2/BrickController2.iOS"
  TARGET_RUNTIME: 'ios-arm64'

jobs:
  build-ios:
    runs-on: macos-26
    name: BrickController iOS Build

    steps:
    - uses: actions/checkout@v6
    - name: Setup MAUI
      id: setup-maui
      uses: ./.github/actions/setup-maui
      with:
        platform: ios

    - name: Set XCode Version
      shell: bash
      run: |
        sudo xcode-select -s "/Applications/Xcode_${{ env.XCODE_VERSION }}.app"
        echo "MD_APPLE_SDK_ROOT=/Applications/Xcode_${{ env.XCODE_VERSION }}.app" >> $GITHUB_ENV

    - name: Verify Xcode version
      run: xcodebuild -version

    - name: Find Current Release Info
      if: github.event_name == 'release' && github.event.action == 'published'
      id: get_release
      uses: octokit/request-action@v3.x
      with:
        route: GET /repos/${{ github.repository }}/releases/tags/${{ github.event.release.tag_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Import Code-Signing Certificates
      uses: Apple-Actions/import-codesign-certs@v7
      with:
        p12-file-base64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}
        p12-password: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}

    - name: Download Apple Provisioning Profiles
      uses: Apple-Actions/download-provisioning-profiles@v6
      with:
        bundle-id: 'cz.vico.brickcontrollerlegacy'
        issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
        api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
        api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

    - name: List Keychain Certificates
      run: security find-identity -v -p codesigning
            
    - name: Restore Dependencies
      run: dotnet restore ${{ env.PROJECT_FOLDER }}/BrickController2.iOS.csproj
    - name: Build MAUI iOS
      run: >-
        dotnet publish ${{ env.PROJECT_FOLDER }}/BrickController2.iOS.csproj
        --no-restore
        -c Release
        -f ${{ steps.setup-maui.outputs.target-framework }}
        -r ${{ env.TARGET_RUNTIME }}
        -p:ApplicationId="cz.vico.brickcontrollerlegacy"
        -p:ApplicationVersion="${{ github.run_number }}"
        -p:ArchiveOnBuild=true
        -p:CodesignKey="iPhone Distribution"
        -p:CodesignProvision=Automatic
        -p:EnableAssemblyILStripping=false
        -p:EnableCodeSigning=true

    - name: List build output
      run: ls -R ${{ env.PROJECT_FOLDER }}/bin/Release/${{ steps.setup-maui.outputs.target-framework }}/${{ env.TARGET_RUNTIME }}/publish/

    - name: Upload IOS Artifact
      uses: actions/upload-artifact@v7
      with:
        name: brickcontroller-ios-ci-build
        path: ${{ env.PROJECT_FOLDER }}/bin/Release/${{ steps.setup-maui.outputs.target-framework }}/${{ env.TARGET_RUNTIME }}/publish/BrickController2.iOS.ipa
        retention-days: 14

    - name: Upload Artifact to Release
      if: github.event_name == 'release' && github.event.action == 'published'
      uses: actions/upload-release-asset@v1
      with:
        upload_url: ${{ fromJson(steps.get_release.outputs.data).upload_url }}
        asset_path: ${{ env.PROJECT_FOLDER }}/bin/Release/${{ steps.setup-maui.outputs.target-framework }}/${{ env.TARGET_RUNTIME }}/publish/BrickController2.iOS.ipa
        asset_name: BrickController_${{ steps.setup-maui.outputs.app-version }}.ipa
        asset_content_type: application/octet-stream
      env:
        GITHUB_TOKEN: ${{ secrets.CI_RELEASE_ASSETS_PAT }}

    - name: Upload app to TestFlight
      if: github.event_name == 'release' && github.event.action == 'published'
      uses: Apple-Actions/upload-testflight-build@v5
      with:
        app-path: '${{ env.PROJECT_FOLDER }}/bin/Release/${{ steps.setup-maui.outputs.target-framework }}/${{ env.TARGET_RUNTIME }}/publish/BrickController2.iOS.ipa'
        issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
        api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
        api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}


name: Build BrickController WinUI 

on:
  push:
    branches:
      - default
      - 'releases/**'
    paths:
      - '.github/**/*.yml'
      - 'BrickController2/*.props'
      - 'BrickController2/*.sln'
      - 'BrickController2/BrickController2/**'
      - 'BrickController2/BrickController2.WinUI/**'
  pull_request:
    branches:    
      - default
      - 'releases/**'
    paths:
      - '.github/**/*.yml'
      - 'BrickController2/*.props'
      - 'BrickController2/*.sln'
      - 'BrickController2/BrickController2/**'
      - 'BrickController2/BrickController2.WinUI/**'
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: windows-2025
    name: BrickController WinUI Build
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Install MAUI Workload
      run: dotnet workload install maui --ignore-failed-sources
            
    - name: Restore Dependencies
      run: dotnet restore BrickController2/BrickController2.WinUI/BrickController2.WinUI.csproj -r win-x64

    - name: Build
      run: dotnet build BrickController2/BrickController2.WinUI/BrickController2.WinUI.csproj -c Release -r win-x64 -f net9.0-windows10.0.19041.0 /p:PublishProfile=win10-x64 --no-restore

    - name: Build MAUI WinUI App
      run: dotnet publish BrickController2/BrickController2.WinUI/BrickController2.WinUI.csproj -c Release -r win-x64 -f net9.0-windows10.0.19041.0 /p:PublishProfile=win10-x64 /p:GenerateAppxPackageOnBuild=true

    - name: Upload WinUI Artifact
      uses: actions/upload-artifact@v4
      with:
        name: brickcontroller-winui-ci-build
        path: .\**\AppPackages\**\*.*